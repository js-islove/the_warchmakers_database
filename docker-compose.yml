services:
  postgres:
    image: postgres:16-alpine
    container_name: watchmaker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchmaker
      POSTGRES_PASSWORD: watchmaker_secret
      POSTGRES_DB: watchmaker_db
    ports:
      - "5435:5432"
    volumes:
      - watchmaker_pgdata_v2:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchmaker -d watchmaker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  watchmaker_pgdata_v2:
