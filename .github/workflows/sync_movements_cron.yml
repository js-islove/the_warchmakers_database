name: Scheduled Watch Movement Sync & Diff

on:
  # Runs automatically every Sunday at 02:00 UTC
  schedule:
    - cron: "0 2 * * 0"
  # Also allows 1-click manual trigger from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      brand:
        description: "Optional manufacturer slug filter (e.g. seiko, eta)"
        required: false
        default: ""
      limit:
        description: "Max pages to scrape on this run"
        required: false
        default: "25"

jobs:
  sync-movements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 2-Level Diff & On-the-Fly Movement Sync
        run: |
          if [ -n "${{ github.event.inputs.brand }}" ]; then
            python etl/scrapers/sync_17jewels_cron.py --refresh-index --brand "${{ github.event.inputs.brand }}" --limit "${{ github.event.inputs.limit || 25 }}"
          else
            python etl/scrapers/sync_17jewels_cron.py --refresh-index --limit "${{ github.event.inputs.limit || 25 }}"
          fi
